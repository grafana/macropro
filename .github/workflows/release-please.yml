name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  release-please:
    name: Run release-please
    runs-on: ubuntu-latest
    steps:
      # Release PRs opened with GITHUB_TOKEN hold their CI runs for manual approval.
      - name: Generate GitHub token
        id: generate-github-token
        uses: grafana/shared-workflows/actions/create-github-app-token@5bbb526b1728ca57fbe1750c4c27ab6ab06171c2 # create-github-app-token/v1.0.0
        with:
          github_app: grafana-oss-big-tent

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.generate-github-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
